name: 🐛 Проблема
title: '[Проблема] '
description: Сообщить о проблеме
labels: ['type: проблема', 'status: нуждается в сортировке']

body:
  - type: textarea
    id: description
    attributes:
      label: Проблема медиа
      description: Некоторые медиа ни в какую не хотят загружаться, хотя более поздние загружаются
      placeholder: Проблема загрузки гифок, картинок и некоторых видео
    validations:
      required: true

  - type: textarea
    id: additions
    attributes:
      label: попробовать сделать прокси таким образом,чтобы он детектил проблемные медиа и загружал их вместо остальныХ.то есть точеченой загрузкой загружались именно проблемные медиа
      description: Если у вас проблемы с работой прокси, то приложите файл логов в момент возникновения проблемы.
